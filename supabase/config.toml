# Supabase project config (used by the GitHub integration + Supabase CLI).
# Set project_id to your project's Reference ID:
#   Dashboard → Project Settings → General → Reference ID
#   (also the <REF> in https://supabase.com/dashboard/project/<REF>)
project_id = "REPLACE_WITH_PROJECT_REF"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true

[realtime]
enabled = true
